services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ai-business-hq-backend:latest
    container_name: hq-backend
    ports:
      - "8700:8700"
    environment:
      # Pass the full env set explicitly — needs to reach the container
      - FOUNDER_TOKEN
      - DATABASE_URL
      - DB_BACKEND
      - MISTRAL_API_KEY
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - LLM_PROVIDER
      - LLM_MODEL
      - KIDBOOK_FAKE_LLM
      - AIHQ_FAKE_LLM
      - AIHQ_ALLOW_DEMO
      - ENABLE_SCHEDULER
      - TZ
      - CORS_ORIGINS
      - ETSY_API_KEY
      - ETSY_ACCESS_TOKEN
      - ETSY_SHOP_ID
      - ETSY_TAXONOMY_ID
      - ETSY_KEYSTRING
      - ETSY_SHARED_SECRET
      - ETSY_REFRESH_TOKEN
      - DEFAULT_BOOK_PRICE_USD
    volumes:
      - ./storage:/app/storage
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: ai-business-hq-frontend:latest
    container_name: hq-frontend
    ports:
      - "3000:3000"
    environment:
      # Same here if you ever serve behind HTTPS with a different origin
      - NEXT_PUBLIC_API_URL=http://localhost:8700
    depends_on:
      - backend
    restart: unless-stopped

  # re-discoveries or long jobs planned for a worker — fill in once background tasks are production-ready
  # scheduler:
  #   build: { context: ., dockerfile: backend/Dockerfile }
  #   command: ["python", "-c", "import agents.workflows.daily_research as dr; dr.run()"]
  #   environment: [ ... same as backend ... ]
  #   schedule: daily
